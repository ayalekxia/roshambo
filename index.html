<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock-paper-scissors</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

</head>
<body>
    <!-- <h1 class="title">Roshambo Game</h1> -->
    <button id = "start" type="button" onclick="startGame()">START</button>

    <div id="options" onclick="playRound(event)">
        <button type="button" class="rock">rock</button>
        <button type="button" class="paper">paper</button>
        <button type="button" class="scissors">scissors</button>
    </div>

    <div class="score">
        You: 0 | Computer: 0
    </div>

    <div class="results">
        Rounds:
    </div>

</body>
</html>
